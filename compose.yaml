services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    environment:
      - PUID=1451001103
      - PGID=1451000513
      - JELLYFIN_PublishedServerUrl=https://jellyfin.kekra.net
      - TZ=America/Los_Angeles
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /mnt/services/jellyfin:/config
      - /mnt/media/Movies:/data/movies
      - /mnt/media/Music:/data/music
      - /mnt/media/TV Shows:/data/tvshows
    ports:
      - 8096:8096 # HTTP
      #- 8920:8920 # HTTPS
      - 7359:7359/udp # LAN discovery
      #- 1900:1900/udp # DNLA
    restart: always
