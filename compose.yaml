services:
  jellyfin:
    image: jellyfin/jellyfin
    user: 1451001103:1451000513
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.kekra.net
      - TZ=America/Los_Angeles
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    volumes:
      - /mnt/services/jellyfin/config:/config
      - ./data:/config/data
      - /mnt/services/jellyfin/cache:/cache
      - /mnt/media/Movies:/data/movies
      - /mnt/media/Music:/data/music
      - /mnt/media/TV Shows:/data/tvshows
    ports:
      - 8096:8096 # HTTP
      - 7359:7359/udp # LAN discovery
    restart: always
